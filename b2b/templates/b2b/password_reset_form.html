{% extends "b2b/base.html" %}
{% load form_extras %}
{% block title %}Відновлення паролю{% endblock %}
{% block content %}
<h2 class="h4 mb-3">Відновлення паролю</h2>
<form method="post" class="card p-3">
  {% csrf_token %}
  <label class="form-label">Email</label>
  {{ form.email.errors }}
  {{ form.email|add_class:"form-control" }}
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary">Надіслати лист</button>
    <a class="btn btn-outline-secondary" href="{% url 'b2b:login' %}">Назад до входу</a>
  </div>
</form>
{% endblock %}
